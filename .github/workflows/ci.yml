name: TaskFlow CI

on:
  push:
    branches:
      - main
      # - develop a commenter car pas dans l'ennoncer
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

jobs:

#############################################################
# BACKEND
#############################################################

  backend:

    name: Backend Validation

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Debug Prisma
        run: |
          echo "Node : $(node -v)"
          echo "NPM : $(npm -v)"

          which node
          which npm

          ls -l node_modules/.bin/prisma

          file node_modules/.bin/prisma

          cat node_modules/.bin/prisma

          chmod +x node_modules/.bin/prisma

          echo "Après chmod"

          ls -l node_modules/.bin/prisma

          ./node_modules/.bin/prisma --version || true

          node node_modules/prisma/build/index.js --version || true

      - name: Fix Prisma permissions
        run: chmod +x node_modules/.bin/prisma

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run Backend Tests
        run: npm test -- --runInBand
        # continue-on-error: false

#############################################################
# FRONTEND
#############################################################

  frontend:

    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build React Application
        run: npm run build
        env:
          CI: false
################################################################
# SECURITY
#############################################################

  security:

    name: SAST - CodeQL
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze code with CodeQL
        uses: github/codeql-action/analyze@v4
#############################################################
# DOCKER
#############################################################

  docker:

    name: Docker Build & Push

    runs-on: ubuntu-latest

    needs:
      # - backend
      # - frontend
      - security

    if: github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag
        id: docker-tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/pelagie-aintangar/taskflow-backend:${{ steps.docker-tag.outputs.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/pelagie-aintangar/taskflow-frontend:${{ steps.docker-tag.outputs.TAG }}

      # - name: Build Docker Compose
      #   run: docker compose build